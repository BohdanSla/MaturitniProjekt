<form method="post">
    <h1>Přidat novou vlastnost</h1>
    <div>
        Přidat novou položku k vlastnosti:
        <select name="vlastnost">
            <option value="kategorie">Kategorie</option>
            <option value="znacka">Značka</option>
            <option value="sport">Sport</option>
            <option value="velikost">Velikost</option>
            <option value="barva">Barva</option>
            <option value="material">Materiál</option>
        </select>
        <input name="nazevVlastnosti">
        <input type="submit" name="novaVlastnost" value="Přidat novou vlastnost">
    </div>
    <h1>Vlastnosti produktu</h1>
    <table>
        <tr>
            <td>kategorie</td>
            <td>
                <input list="vlastnostiKategorie" name="kategorieVlastnost">
                <datalist id="vlastnostiKategorie">
                    [@vlastnostiKategorie]
                </datalist>
            </td>
            <td>
                <input type="submit" name="kategorieOdstranit" value="odstranit kategorii" class="odstranit">
            </td>
        </tr>
        <tr>
            <td>Značky</td>
            <td>
                <input list="vlastnostiZnacky"  name="znackaVlastnost">
                <datalist id="vlastnostiZnacky">
                    [@vlastnostiZnacky]
                </datalist>
            </td>
            <td>
                <input type="submit" name="znackaOdstranit" value="odstranit značku" class="odstranit">
            </td>
        </tr>
        <tr>
            <td>Sporty</td>
            <td>
                <input list="vlastnostiSporty"  name="sportVlastnost">
                <datalist id="vlastnostiSporty">
                    [@vlastnostiSporty]
                </datalist>
            </td>
            <td>
                <input type="submit" name="sportOdstranit" value="odstranit sport" class="odstranit">
            </td>
        </tr>
        <tr>
            <td>Velikosti</td>
            <td>
                <input list="vlastnostiVelikosti"  name="velikostVlastnost">
                <datalist id="vlastnostiVelikosti">
                    [@vlastnostiVelikosti]
                </datalist>
            </td>
            <td>
                <input type="submit" name="velikostOdstranit" value="odstranit velikost" class="odstranit">
            </td>
        </tr>
        <tr>
            <td>Barvy</td>
            <td>
                <input list="vlastnostiBarvy"  name="barvaVelikost">
                <datalist id="vlastnostiBarvy">
                    [@vlastnostiBarvy]
                </datalist>
            </td>
            <td>
                <input type="submit" name="barvaOdstranit" value="odstranit barvu" class="odstranit">
            </td>
        </tr>
        <tr>
            <td>Materiály</td>
            <td>
                <input list="vlastnostiMaterialy"  name="materialVlastnost">
                <datalist id="vlastnostiMaterialy">
                    [@vlastnostiMaterialy]
                </datalist>
            </td>
            <td>
                <input type="submit" name="materialOdstranit" value="odstranit materiál" class="odstranit">
            </td>
        </tr>
    </table>
</form>
