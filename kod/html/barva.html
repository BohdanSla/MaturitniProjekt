<h1>[@produkt]</h1>
<form method="post" enctype="multipart/form-data">
    <section>

        <table>
            <thead>
                <th>
                    Velikost
                </th>
                <th>
        
                </th>
            </thead>
            <tbody>
                [@velikosti]
                <tr>
                    <td>
                        <input list="velikosti" name="novaVelikost" placeholder="Přidat novou velikost">
                        <datalist id="velikosti">
                            [@zbyvajiciVelikosti]
                        </datalist>
                    </td>
                    <td>
                        <input type="submit" name="pridatVelikost" value="Přidat velikost">
                    </td>
                </tr>
            </tbody>
        </table>
        <table>
            <thead>
                <th>
                    Obrázky
                </th>
                <th>
    
                </th>
            </thead>
            <tbody>
                [@obrazky]
                <tr>
                    <td>
                        <input type="file" name="novyObrazek">
                    </td>
                    <td>
                        <input type="submit" name="pridatObrazek" value="Přidat obrázek">
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</form>
